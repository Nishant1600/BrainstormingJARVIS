<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Terminal recording: a run is spawned, succeeds, and writes hello.txt">
  <rect width="1200" height="400" fill="#060b14" rx="18"/>
  <circle cx="52" cy="42" r="9" fill="#ff5f57"/>
  <circle cx="80" cy="42" r="9" fill="#febc2e"/>
  <circle cx="108" cy="42" r="9" fill="#28c840"/>
  <text x="140" y="50" font-family="Consolas, monospace" font-size="20" fill="#5f8cab">powershell — proving JARVIS builds</text>
  <g font-family="Consolas, monospace" font-size="21">
    <text x="40" y="100" fill="#8fb8d8" opacity="0">POST /api/runs → run f9ed9f00… spawned
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="142" fill="#8fb8d8" opacity="0">status=running in=0 out=0 turns=0
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="40" y="184" fill="#8fb8d8" opacity="0">status=running in=8920 out=174 turns=2
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.7s" fill="freeze"/>
    </text>
    <text x="40" y="226" fill="#3fd98a" opacity="0">status=succeeded in=9180 out=185 turns=3
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.8s" fill="freeze"/>
    </text>
    <text x="40" y="268" fill="#e8f2fc" opacity="0">hello.txt content='HELLO-JARVIS'
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="4.9s" fill="freeze"/>
    </text>
    <text x="40" y="310" font-weight="bold" fill="#3fd98a" opacity="0">PROOF-PASSED
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="6s" fill="freeze"/>
    </text>
    <rect x="240" y="292" width="14" height="26" fill="#3fa9f5">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
