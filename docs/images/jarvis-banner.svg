<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="JARVIS — voice assistant for OpenCode on Windows">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fd8ff"/>
      <stop offset="45%" stop-color="#3fa9f5"/>
      <stop offset="100%" stop-color="#0b1e33"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" rx="18"/>
  <g transform="translate(200,160)" fill="none" stroke="#3fa9f5">
    <circle r="34" fill="url(#core)" stroke="none"/>
    <circle r="52" stroke-width="2" opacity="0.9">
      <animate attributeName="r" values="52;62;52" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="78" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="78;92;78" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="108" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="108;124;108" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Segoe UI, Verdana, sans-serif" fill="#e8f2fc">
    <text x="340" y="140" font-size="72" font-weight="600" letter-spacing="14">JARVIS</text>
    <text x="344" y="185" font-size="22" fill="#8fb8d8" letter-spacing="2">Just A Rather Very Intelligent System</text>
    <text x="344" y="222" font-size="22" fill="#5f8cab" letter-spacing="2">voice for OpenCode
      <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="344" y="259" font-size="22" fill="#5f8cab" letter-spacing="2">Windows native · every run recorded</text>
  </g>
</svg>
